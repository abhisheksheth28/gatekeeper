name: renovate

# Source-side dependency and security automation. Runs weekly (Monday 08:00 UTC) and can also be
# dispatched manually. Self-hosted Renovate Action.

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log only — open no PRs"
        type: boolean
        default: false
      log_level:
        description: "Renovate log level"
        type: choice
        options: [info, debug]
        default: info

permissions: read-all

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    # Canonical repo only. Forks use renovate-forktest.yaml; this also blocks a manual dispatch on a fork.
    if: github.repository == 'open-policy-agent/gatekeeper'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      # Manual dry-run opens no PRs and writes nothing.
      - name: Select dry-run mode
        if: inputs.dry_run
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      # Narrow the processed base branches to the maintained n/n-1 release lines at runtime, so
      # the config's release policy stays a generic regex (no per-release churn).
      - name: Resolve maintained release branches
        run: |
          set -euo pipefail
          maintained=$(
            git ls-remote --heads origin \
              | sed 's#.*refs/heads/##' \
              | grep -E '^release-[0-9]+\.[0-9]+$' \
              | sort -V | tail -2
          ) || true
          if [ -z "${maintained:-}" ]; then echo "no release-*.* branches found on origin" >&2; exit 1; fi
          patterns='"$default"'
          for b in $maintained; do patterns="$patterns,\"$b\""; done
          echo "RENOVATE_BASE_BRANCH_PATTERNS=[$patterns]" >> "$GITHUB_ENV"
          echo "Resolved RENOVATE_BASE_BRANCH_PATTERNS=[$patterns]"

      - name: Run Renovate
        uses: renovatebot/github-action@316d7cd859606d6039a2182b7d69199e9b036835 # v46.2.1
        with:
          configurationFile: .github/renovate.json5
          # Prefer a dedicated bot token (PAT/App) so PRs trigger CI; GITHUB_TOKEN works but its PRs
          # don't start other workflows. Set RENOVATE_TOKEN to override.
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_PLATFORM: github
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
