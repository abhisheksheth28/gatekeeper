name: renovate-forktest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = no writes (logs only); live = open real PRs on THIS fork"
        type: choice
        options: [dry-run, live]
        default: dry-run
      log_level:
        description: "Renovate log level"
        type: choice
        options: [debug, info]
        default: debug

permissions: read-all

concurrency:
  group: renovate-forktest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      # dry-run (default) sets RENOVATE_DRY_RUN=full; live leaves it unset for a real run.
      - name: Select dry-run mode
        if: inputs.mode == 'dry-run'
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      # Narrow the processed base branches to the maintained n/n-1 release lines at runtime,
      # so the config's release-branch policy stays generic (no per-release churn).
      - name: Resolve maintained release branches
        run: |
          set -euo pipefail
          stable=$(git tag --list | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V)
          if [ -z "$stable" ]; then echo "no stable release tags found" >&2; exit 1; fi
          latest=$(printf '%s\n' "$stable" | tail -1)
          latest_minor=${latest%.*}
          patterns="\"\$default\",\"release-${latest_minor#v}\""
          prev=$(printf '%s\n' "$stable" | awk -v m="${latest_minor}." 'index($0, m) != 1' | tail -1)
          if [ -n "$prev" ]; then
            prev_minor=${prev%.*}
            patterns="$patterns,\"release-${prev_minor#v}\""
          fi
          echo "RENOVATE_BASE_BRANCH_PATTERNS=[$patterns]" >> "$GITHUB_ENV"
          echo "Resolved RENOVATE_BASE_BRANCH_PATTERNS=[$patterns]"

      - name: Run Renovate
        uses: renovatebot/github-action@316d7cd859606d6039a2182b7d69199e9b036835 # v46.2.1
        with:
          configurationFile: .github/renovate.forktest.json5
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "optional"
          RENOVATE_PLATFORM: github
          LOG_LEVEL: ${{ inputs.log_level }}
