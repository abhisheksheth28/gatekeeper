name: renovate-forktest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = no writes (logs only); live = open real PRs on THIS fork"
        type: choice
        options: [dry-run, live]
        default: dry-run
      log_level:
        description: "Renovate log level"
        type: choice
        options: [debug, info]
        default: debug

permissions: read-all

concurrency:
  group: renovate-forktest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      # dry-run (default) sets RENOVATE_DRY_RUN=full; live leaves it unset for a real run.
      - name: Select dry-run mode
        if: inputs.mode == 'dry-run'
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      - name: Run Renovate
        uses: renovatebot/github-action@316d7cd859606d6039a2182b7d69199e9b036835 # v46.2.1
        with:
          configurationFile: .github/renovate.forktest.json5
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "optional"
          RENOVATE_PLATFORM: github
          LOG_LEVEL: ${{ inputs.log_level }}
