name: renovate-forktest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = no writes (logs only); live = open real PRs on THIS fork"
        type: choice
        options: [dry-run, live]
        default: dry-run
      log_level:
        description: "Renovate log level"
        type: choice
        options: [debug, info]
        default: debug

permissions: read-all

concurrency:
  group: renovate-forktest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # dry-run (default) sets RENOVATE_DRY_RUN=full; live leaves it unset for a real run.
      - name: Select dry-run mode
        if: inputs.mode == 'dry-run'
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      # Narrow the processed base branches to the maintained n/n-1 release lines at runtime,
      # so the config's release-branch policy stays generic (no per-release churn).
      # Resolve from the release branches themselves.
      - name: Resolve maintained release branches
        run: |
          set -euo pipefail
          maintained=$(
            git ls-remote --heads origin \
              | sed 's#.*refs/heads/##' \
              | grep -E '^release-[0-9]+\.[0-9]+$' \
              | sort -V | tail -2
          ) || true
          if [ -z "${maintained:-}" ]; then echo "no release-*.* branches found on origin" >&2; exit 1; fi
          patterns='"$default"'
          for b in $maintained; do patterns="$patterns,\"$b\""; done
          echo "RENOVATE_BASE_BRANCH_PATTERNS=[$patterns]" >> "$GITHUB_ENV"
          echo "Resolved RENOVATE_BASE_BRANCH_PATTERNS=[$patterns]"

      # Mint a token from the GitHub App so Renovate acts as the app bot — this is what lets CI
      # trigger on its PRs and lets it edit workflow files (github-actions manager needs it).
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Get the app's user id
        id: app-user
        run: echo "id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Run Renovate
        uses: renovatebot/github-action@316d7cd859606d6039a2182b7d69199e9b036835 # v46.2.1
        with:
          configurationFile: .github/renovate.forktest.json5
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "optional"
          RENOVATE_PLATFORM: github
          RENOVATE_USERNAME: "${{ steps.app-token.outputs.app-slug }}[bot]"
          RENOVATE_GIT_AUTHOR: "${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.app-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>"
          LOG_LEVEL: ${{ inputs.log_level }}
